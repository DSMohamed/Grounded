services:
  - type: web
    name: grounded-clinical-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPEN_ROUTER_KEY
        sync: false
      - key: OPEN_ROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-2-1212
